<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL 训练场 · SQL 学习中心</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="practice">
  <header class="topbar">
    <div class="brand">
      <button class="menu-toggle" id="menuToggle" aria-label="菜单" aria-expanded="false">☰</button>
      <span class="logo">🛢️</span>
      <div class="brand-text">
        <a href="index.html" class="brand-link"><h1>SQL 学习中心</h1></a>
        <p class="subtitle">教程 · 速查表 · 题库 · 训练场</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="index.html" data-nav="home">🏠 主页</a>
      <a href="tutorial.html" data-nav="tutorial">📘 教程</a>
      <a href="cheatsheet.html" data-nav="cheatsheet">📋 速查表</a>
      <a href="questions.html" data-nav="questions">🧩 题库</a>
      <a href="practice.html" data-nav="practice">⚡ 训练场</a>
      <a href="notes.html" data-nav="notes">📝 笔记</a>
    </nav>
  </header>

  <main class="practice-page">
    <div class="section-head">
      <h2>SQL 训练场</h2>
      <p>真正的 SQLite 在浏览器内运行（基于 sql.js / WebAssembly）。左侧写 SQL，右侧看结果。手机端建议横屏使用。</p>
    </div>

    <!-- 题库带过来的题目会出现在这里（编辑器留空，先自行思考） -->
    <div id="questionPanel" class="question-panel" hidden></div>

    <div class="practice-wrap">
      <div class="editor-col">
        <div class="editor-head">
          <span>SQL 编辑器（SQLite，浏览器内运行）<span id="engineStatus" class="engine-status"></span></span>
          <div class="editor-actions">
            <button id="runBtn" class="btn primary">▶ 运行</button>
            <button id="resetBtn" class="btn">↻ 重置库</button>
            <button id="clearBtn" class="btn">清空</button>
          </div>
        </div>
        <textarea id="sqlInput" spellcheck="false" placeholder="在此输入 SQL，例如：SELECT * FROM books LIMIT 10;"></textarea>
        <div class="editor-quick">
          <span>快速示例：</span>
          <button class="chip" data-q="SELECT * FROM books LIMIT 10;">浏览图书</button>
          <button class="chip" data-q="SELECT name FROM categories;">分类列表</button>
          <button class="chip" data-q="SELECT b.title, a.name AS 作者 FROM books b JOIN authors a ON b.author_id=a.author_id LIMIT 10;">图书+作者</button>
          <button class="chip" data-q="SELECT category_id, COUNT(*) AS 数量 FROM books GROUP BY category_id;">分类统计</button>
        </div>
      </div>
      <div class="result-col">
        <div class="result-head">
          <span>运行结果</span>
          <span id="resultMeta" class="result-meta"></span>
        </div>
        <div id="resultArea" class="result-area">
          <div class="placeholder">运行查询后，结果将显示在这里。</div>
        </div>
        <details class="schema-box">
          <summary>📊 数据库结构（点击展开，可在编辑器里引用）</summary>
          <div id="schemaInfo" class="schema-info"></div>
        </details>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>SQL 学习中心 · 基于 SQLite (sql.js) 纯前端构建 · 数据为本站示例「网上书店」</span>
  </footer>

  <script src="lib/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/site.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
