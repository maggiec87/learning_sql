<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL 学习中心 · 教程 / 速查表 / 题库 / 训练场</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛢️</span>
      <div>
        <h1>SQL 学习中心</h1>
        <p class="subtitle">完整教程 · 速查表 · 100 题题库 · 浏览器内训练场</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-target="tutorial">📘 教程</button>
      <button class="tab" data-target="cheatsheet">📋 速查表</button>
      <button class="tab" data-target="questions">🧩 题库</button>
      <button class="tab" data-target="practice">⚡ 训练场</button>
    </nav>
  </header>

  <!-- 教程 -->
  <section id="tutorial" class="panel active">
    <aside class="tut-side" id="tutSide"></aside>
    <div class="tut-main" id="tutMain"></div>
  </section>

  <!-- 速查表 -->
  <section id="cheatsheet" class="panel">
    <div class="section-head">
      <h2>SQL 速查表</h2>
      <p>按场景分类的常用语法，点击「复制」即可取用。</p>
    </div>
    <div id="cheatGrid" class="cheat-grid"></div>
  </section>

  <!-- 题库 -->
  <section id="questions" class="panel">
    <div class="section-head">
      <h2>SQL 题库（100 题）</h2>
      <p>由浅入深，覆盖查询、聚合、连接、子查询与窗口函数。点开看提示与参考答案，可一键加载到训练场练习。</p>
    </div>
    <div class="q-filters" id="qFilters"></div>
    <div class="q-stats" id="qStats"></div>
    <div id="qList" class="q-list"></div>
  </section>

  <!-- 训练场 -->
  <section id="practice" class="panel">
    <div class="practice-wrap">
      <div class="editor-col">
        <div class="editor-head">
          <span>SQL 编辑器（SQLite，浏览器内运行）</span>
          <div class="editor-actions">
            <button id="runBtn" class="btn primary">▶ 运行 (Ctrl/Cmd+Enter)</button>
            <button id="resetBtn" class="btn">↻ 重置数据库</button>
            <button id="clearBtn" class="btn">清空</button>
          </div>
        </div>
        <textarea id="sqlInput" spellcheck="false" placeholder="在此输入 SQL，例如：SELECT * FROM books LIMIT 10;"></textarea>
        <div class="editor-quick">
          <span>快速示例：</span>
          <button class="chip" data-q="SELECT * FROM books LIMIT 10;">浏览图书</button>
          <button class="chip" data-q="SELECT name FROM categories;">分类列表</button>
          <button class="chip" data-q="SELECT b.title, a.name AS 作者 FROM books b JOIN authors a ON b.author_id=a.author_id LIMIT 10;">图书+作者</button>
          <button class="chip" data-q="SELECT category_id, COUNT(*) AS 数量 FROM books GROUP BY category_id;">分类统计</button>
        </div>
      </div>
      <div class="result-col">
        <div class="result-head">
          <span>运行结果</span>
          <span id="resultMeta" class="result-meta"></span>
        </div>
        <div id="resultArea" class="result-area">
          <div class="placeholder">运行查询后，结果将显示在这里。</div>
        </div>
        <details class="schema-box">
          <summary>📊 数据库结构（点击展开，可在编辑器里引用）</summary>
          <div id="schemaInfo" class="schema-info"></div>
        </details>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span>SQL 学习中心 · 基于 SQLite (sql.js) 纯前端构建 · 数据为本站示例"网上书店"</span>
  </footer>

  <script src="lib/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/cheatsheet.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
